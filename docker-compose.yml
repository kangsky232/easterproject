services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_smoke}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  emqx:
    image: emqx/emqx:5.9.3
    restart: unless-stopped
    networks: [internal]

  rag-service:
    build: ./rag-service
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["5001"]
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_smoke}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_BROKER: ${MQTT_BROKER:-ssl://85d896cdd1.st1.iotda-app.cn-north-4.myhuaweicloud.com:8883}
      MQTT_ACCESS_KEY: ${MQTT_ACCESS_KEY:-}
      MQTT_ACCESS_CODE: ${MQTT_ACCESS_CODE:-}
      MQTT_INSTANCE_ID: ${MQTT_INSTANCE_ID:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-smoke/report}
      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-false}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RAG_SERVICE_URL: http://rag-service:5001/api/chat/query
      RAG_HEALTH_URL: http://rag-service:5001/api/health
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-130}
      RAG_HEALTH_TIMEOUT_SECONDS: ${RAG_HEALTH_TIMEOUT_SECONDS:-2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_FILE: /app/logs/smart-smoke.log
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_started
      emqx:
        condition: service_started
    expose: ["8080"]
    networks: [internal]

  frontend:
    build: ./smoke-detector-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    networks: [edge, internal]

volumes:
  mysql-data:
  backend-logs:

networks:
  edge:
  internal:
    internal: true
