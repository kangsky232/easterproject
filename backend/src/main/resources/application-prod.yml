server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker: ${MQTT_BROKER:ssl://85d896cdd1.st1.iotda-app.cn-north-4.myhuaweicloud.com:8883}
  access-key: ${MQTT_ACCESS_KEY:}
  access-code: ${MQTT_ACCESS_CODE:}
  instance-id: ${MQTT_INSTANCE_ID:}
  topic: ${MQTT_TOPIC:smoke/report}
  subscribe-timeout-ms: ${MQTT_SUBSCRIBE_TIMEOUT_MS:10000}
  reconnect-interval-ms: ${MQTT_RECONNECT_INTERVAL_MS:30000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

bootstrap-admin:
  enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  username: ${BOOTSTRAP_ADMIN_USERNAME:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  reset-password: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

smoke:
  offline-timeout-seconds: ${OFFLINE_TIMEOUT_SECONDS:60}
  offline-check-interval-ms: ${OFFLINE_CHECK_INTERVAL_MS:3000}

rag:
  service-url: ${RAG_SERVICE_URL}
  health-url: ${RAG_HEALTH_URL}
  timeout-seconds: ${RAG_TIMEOUT_SECONDS:130}
  health-timeout-seconds: ${RAG_HEALTH_TIMEOUT_SECONDS:2}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  device-auth:
    enabled: true
  security:
    trust-forwarded-headers: true
  login-rate-limit:
    # Opt-in only. Prefer edge/gateway rate limiting for internet-facing deployments.
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:false}
    max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
    lock-seconds: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:900}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  file:
    name: ${LOG_FILE:logs/smart-smoke.log}
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
