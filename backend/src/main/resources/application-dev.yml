server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Use IPv4 explicitly: the local MySQL instance may listen on 127.0.0.1 only.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_smoke?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker: ${MQTT_BROKER:ssl://85d896cdd1.st1.iotda-app.cn-north-4.myhuaweicloud.com:8883}
  access-key: ${MQTT_ACCESS_KEY:}
  access-code: ${MQTT_ACCESS_CODE:}
  instance-id: ${MQTT_INSTANCE_ID:}
  topic: ${MQTT_TOPIC:smoke/report}
  subscribe-timeout-ms: ${MQTT_SUBSCRIBE_TIMEOUT_MS:10000}
  reconnect-interval-ms: ${MQTT_RECONNECT_INTERVAL_MS:30000}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}

bootstrap-admin:
  enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:000000}
  reset-password: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

smoke:
  offline-timeout-seconds: 60
  offline-check-interval-ms: 30000

rag:
  service-url: ${RAG_SERVICE_URL:http://127.0.0.1:5001/api/chat/query}
  health-url: ${RAG_HEALTH_URL:http://127.0.0.1:5001/api/health}
  timeout-seconds: ${RAG_TIMEOUT_SECONDS:130}
  health-timeout-seconds: ${RAG_HEALTH_TIMEOUT_SECONDS:2}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  device-auth:
    enabled: ${DEVICE_AUTH_ENABLED:false}
  security:
    trust-forwarded-headers: false
  login-rate-limit:
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
    max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
    lock-seconds: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:900}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

# Do not log request DTOs at DEBUG level: login DTOs contain passwords.
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
